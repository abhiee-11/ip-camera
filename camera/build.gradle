// Release signing values come from local.properties (never committed) or from
// -P flags, which is what CI uses.
def signingValues = new Properties()
def signingPropertiesFile = rootProject.file('local.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingValues.load(it) }
}
def signingValue = { String name ->
    if (project.hasProperty(name)) {
        return project.property(name).toString()
    }
    return signingValues.getProperty(name)
}
def signingStoreFile = signingValue('signing.storeFile')
def signingStorePassword = signingValue('signing.storePassword')
def signingKeyAlias = signingValue('signing.keyAlias')
def signingKeyPassword = signingValue('signing.keyPassword')
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword


